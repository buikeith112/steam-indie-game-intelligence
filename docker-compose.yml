services:
  postgres:
    image: postgres:16
    container_name: steam_intel_pg
    environment:
      POSTGRES_USER: steam
      POSTGRES_PASSWORD: steam
      POSTGRES_DB: steam_intel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U steam -d steam_intel"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
